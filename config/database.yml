production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    database: automotive_enterprise_management_system_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: automotive_enterprise_management_system_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: automotive_enterprise_management_system_production_cable
    migrations_paths: db/cable_migrate